<!-- JEUX D'ICÔNES : MÉTHODE — Piloter | Style ligne fine, carrés arrondis cohérents avec le logo CARPATH -->
<!-- NE PAS réutiliser pour les piliers du CARPATH Operating System -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-label="Piloter">
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Volant de pilotage / gouvernail stylisé -->
  <circle cx="24" cy="24" r="11" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <circle cx="24" cy="24" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Branches du volant — 3 rayons réguliers -->
  <line x1="24" y1="21" x2="24" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26.6" y1="21.5" x2="32.5" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21.4" y1="21.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Aiguille de cap — pleine, fine, pointée haut-droite (performance) -->
  <line x1="24" y1="27" x2="28" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
