<!-- JEUX D'ICÔNES : MÉTHODE — Écouter | Style ligne fine, carrés arrondis cohérents avec le logo CARPATH -->
<!-- NE PAS réutiliser pour les piliers du CARPATH Operating System -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-label="Écouter">
  <!-- Oreille stylisée : courbe d'écoute + canal interne, dans un carré arrondi -->
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Pavillon de l'oreille -->
  <path d="M20 12 C13 12 10 17 10 22 C10 30 16 33 18 35 C19 36 19 38 17 39" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Canal interne -->
  <path d="M20 12 C26 12 30 17 30 22 C30 27 27 30 24 31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Point d'écoute active -->
  <circle cx="22" cy="22" r="2.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Ondes sonores entrantes -->
  <path d="M34 16 C36 18 36 22 34 26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M37 13 C40 17 40 25 37 29" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
