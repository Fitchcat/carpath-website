<!-- JEUX D'ICÔNES : CARPATH OPERATING SYSTEM — Conversion | Style ligne fine, carrés arrondis cohérents avec le logo CARPATH -->
<!-- NE PAS réutiliser pour les étapes de la méthode -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-label="Conversion">
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Deux états : point à gauche (prospect) → point à droite (client) avec flèche de transformation -->
  <!-- Prospect (cercle ouvert) -->
  <circle cx="13" cy="24" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Client (carré arrondi plein — engage, ancré) -->
  <rect x="30" y="19" width="10" height="10" rx="3" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Flèche de conversion -->
  <line x1="20" y1="24" x2="28" y2="24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="25,21 28,24 25,27" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Coche de validation dans le carré -->
  <polyline points="32.5,24 34.5,26.5 38,22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
