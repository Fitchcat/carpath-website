<!-- JEUX D'ICÔNES : MÉTHODE — Concevoir | Style ligne fine, carrés arrondis cohérents avec le logo CARPATH -->
<!-- NE PAS réutiliser pour les piliers du CARPATH Operating System -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-label="Concevoir">
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Feuille de plan / blueprint -->
  <rect x="12" y="13" width="24" height="18" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Lignes de plan horizontales -->
  <line x1="16" y1="19" x2="28" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="24" y2="23" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crayon / stylet de conception -->
  <path d="M30 33 L36 27 L38 29 L32 35 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  <line x1="30" y1="33" x2="28" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nib du crayon -->
  <line x1="36" y1="27" x2="38" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
