<!-- JEUX D'ICÔNES : CARPATH OPERATING SYSTEM — Pilotage et optimisation | Style ligne fine, carrés arrondis cohérents avec le logo CARPATH -->
<!-- NE PAS réutiliser pour les étapes de la méthode -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-label="Pilotage et optimisation">
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Tableau de bord / dashboard avec jauge et indicateurs -->
  <!-- Fond de la jauge (demi-cercle) -->
  <path d="M12 30 A12 12 0 0 1 36 30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Graduations -->
  <line x1="12" y1="30" x2="14" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="30" x2="34" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="18" x2="24" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Aiguille — pointée vers haut-droite (performance) -->
  <line x1="24" y1="30" x2="31" y2="22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pivot central -->
  <circle cx="24" cy="30" r="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Barres d'indicateurs en bas -->
  <rect x="13" y="34" width="3" height="6" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <rect x="19" y="31" width="3" height="9" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <rect x="25" y="33" width="3" height="7" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <rect x="31" y="29" width="3" height="11" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
</svg>
